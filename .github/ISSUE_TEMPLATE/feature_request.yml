name: Feature request
description: Suggest a new capability or an improvement for OpenUaExplorer
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        Please describe the problem you are trying to solve, not only the
        solution you have in mind — that usually leads to a better feature.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched the [existing issues](https://github.com/sanny32/OpenUaExplorer/issues?q=is%3Aissue) and did not find the same request.
          required: true
        - label: I checked the [latest release](https://github.com/sanny32/OpenUaExplorer/releases/latest) and the feature is not there yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >-
        Describe the situation you run into today and why the current behaviour
        is not enough.
      placeholder: >-
        When I monitor a few hundred nodes, I cannot tell which of them stopped
        updating, because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        What should the application do? Describe the workflow — which menu,
        panel or dialog it belongs to, and what you would see on screen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the application
      description: Where does this feature belong? Pick the closest match.
      options:
        - Connection, endpoints and security
        - Certificates and trust store
        - Address space browsing
        - Node attributes and references
        - Writing values and calling methods
        - Data Access panel
        - Subscriptions and events
        - History (data and events)
        - Trend graphs
        - Sessions, favorites and recent connections
        - Log and diagnostics
        - Namespace Inspector / Node Monitor
        - Settings, themes and general UI
        - Translations and localization
        - Packaging, installation and updates
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: >-
        Workarounds you use today, or other ways the problem could be solved.
    validations:
      required: false

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: >-
        If another OPC UA client already does this well, name it and describe
        how it works there. Links to the relevant part of the OPC UA
        specification are welcome too.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Mockups and additional context
      description: >-
        Screenshots, sketches, or anything else that helps to picture the
        feature.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this feature myself.
          required: false
